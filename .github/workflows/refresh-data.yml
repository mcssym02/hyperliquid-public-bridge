name: Refresh public crypto data

on:
  workflow_dispatch:
  push:
    paths:
      - "app.py"
      - "collect_static.py"
      - "collect_uniswap_lp.py"
      - "requirements.txt"
      - ".github/workflows/refresh-data.yml"
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

concurrency:
  group: public-crypto-data-refresh
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect official Hyperliquid data and public liquidation feed
        run: python collect_static.py

      - name: Collect Base Uniswap V3 LP state read-only
        run: python collect_uniswap_lp.py

      - name: Validate generated JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          required = [
              "health.json",
              "snapshot.json",
              "history-2h.json",
              "xaut.json",
              "liquidations.json",
              "derived.json",
              "multi-tf.json",
              "radar-core.json",
              "market-state-history.json",
              "uniswap-lp.json",
          ]
          loaded = {}
          for name in required:
              p = Path("data") / name
              assert p.exists(), f"missing {p}"
              data = json.loads(p.read_text())
              assert data.get("timestamp_utc"), f"missing timestamp in {name}"
              loaded[name] = data

          xaut = loaded["xaut.json"]
          assert xaut.get("instrument") == "XAUT0/USDC", "XAUT identity mismatch"
          assert xaut.get("type") == "spot", "XAUT must be spot"
          if xaut.get("status") in ("OK", "PARTIAL"):
              assert str(xaut.get("api_coin", "")).startswith("@"), "XAUT @index missing"
              assert xaut.get("base", {}).get("name") == "XAUT0", "wrong XAUT base token"
              assert xaut.get("quote", {}).get("name") == "USDC", "wrong XAUT quote token"

          snapshot = loaded["snapshot.json"]
          snap_xaut = next((a for a in snapshot.get("assets", []) if a.get("asset") == "XAUT0"), None)
          assert snap_xaut is not None, "XAUT missing from snapshot"
          assert snap_xaut.get("instrument") == "XAUT0/USDC", "snapshot XAUT identity mismatch"
          assert snap_xaut.get("type") == "spot", "snapshot XAUT must be spot"

          derived = loaded["derived.json"]
          assets = {a.get("asset"): a for a in derived.get("assets", []) if isinstance(a, dict)}
          for asset in ("BTC", "ETH", "SOL", "HYPE", "XAUT0"):
              assert asset in assets, f"{asset} missing from derived.json"
          assert assets["XAUT0"].get("delta_oi_h1_abs") == "NOT_APPLICABLE", "XAUT OI must be N/A"
          assert assets["XAUT0"].get("funding") == "NOT_APPLICABLE", "XAUT funding must be N/A"

          liq = loaded["liquidations.json"]
          assert liq.get("window_minutes") == 60, "liquidation window must be 60m"
          liq_assets = {a.get("asset"): a for a in liq.get("assets", []) if isinstance(a, dict)}
          for asset in ("BTC", "ETH", "SOL", "HYPE"):
              assert asset in liq_assets, f"{asset} missing from liquidations.json"
              row = liq_assets[asset]
              assert "global_coverage_status" in row, f"{asset} global liquidation coverage missing"
              assert "global_h1" in row, f"{asset} global liquidation aggregate missing"
              assert "hyperliquid_coverage_status" in row, f"{asset} HL liquidation coverage missing"
              assert "hyperliquid_observed_h1" in row, f"{asset} HL liquidation aggregate missing"
              if row.get("global_coverage_status") == "FULL_60M_ARCHIVE":
                  gh = row.get("global_h1", {})
                  assert gh.get("status") == "OK", f"{asset} global H-1 marked full but aggregate not OK"
                  assert gh.get("total_usd") is not None, f"{asset} global H-1 total missing"
                  assert gh.get("long_usd") is not None, f"{asset} global long liquidation total missing"
                  assert gh.get("short_usd") is not None, f"{asset} global short liquidation total missing"

          mtf = loaded["multi-tf.json"]
          assert mtf.get("status") in ("OK", "PARTIAL"), f"multi-TF unavailable: {mtf.get('status')}"
          mtf_assets = mtf.get("assets", {})
          for asset in ("BTC", "ETH", "SOL", "HYPE", "XAUT0"):
              assert asset in mtf_assets, f"{asset} missing from multi-tf.json"
              tfs = mtf_assets[asset].get("timeframes", {})
              for tf in ("15m", "1h", "4h", "1d"):
                  assert tf in tfs, f"{asset} {tf} missing from multi-tf.json"

          core = loaded["radar-core.json"]
          assert core.get("version") == "1.6.0", f"unexpected radar-core version {core.get('version')}"
          assert core.get("component_status", {}).get("primary_market") in ("OK", "PARTIAL"), "primary market unavailable"
          assert core.get("component_status", {}).get("h1_baseline") in ("OK", "NOT_RECORDED"), "invalid H-1 baseline status"
          # A transient H-1 gap must not prevent publishing otherwise fresh primary data.
          # radar-core will mark the run DEGRADED_PRIMARY until the rolling baseline is rebuilt.
          assert core.get("component_status", {}).get("multi_tf") in ("OK", "PARTIAL"), "multi-TF missing in radar-core"
          core_assets = core.get("assets", {})
          for asset in ("BTC", "ETH", "SOL", "HYPE"):
              assert asset in core_assets, f"{asset} missing from radar-core"
              assert "derivatives_horizons" in core_assets[asset], f"{asset} derivative horizons missing"
              assert "multi_tf" in core_assets[asset], f"{asset} multi-TF missing"
          assert core_assets.get("XAUT0", {}).get("type") == "spot", "radar-core XAUT0 must be spot"

          state = loaded["market-state-history.json"]
          assert isinstance(state.get("records"), list), "state records missing"
          assert state.get("record_count") == len(state.get("records", [])), "state record_count mismatch"

          lp = loaded["uniswap-lp.json"]
          assert lp.get("status") in ("OK", "PARTIAL"), f"LP collector failed: {lp.get('error')}"
          assert lp.get("security", {}).get("mode") == "READ_ONLY", "LP collector not read-only"
          assert lp.get("security", {}).get("transaction_broadcast") is False, "LP broadcast must be false"
          assert lp.get("chain", {}).get("chain_id") == 8453, "LP wrong chain"
          assert lp.get("position", {}).get("nft_id") == 6000457, "LP wrong NFT"
          assert lp.get("position", {}).get("owner_matches_expected") is True, "LP owner mismatch"
          assert lp.get("contracts", {}).get("nonfungible_position_manager", "").lower() == "0x03a520b32c04bf3beef7beb72e919cf822ed34f1", "LP wrong position manager"
          assert lp.get("contracts", {}).get("factory", "").lower() == "0x33128a8fc17869897dce68ed026d694621f6fdfd", "LP wrong factory"
          assert lp.get("pool_state", {}).get("range_status") in (
              "IN RANGE", "OUT OF RANGE — HAUT", "OUT OF RANGE — BAS"
          ), "LP range status missing"

          print("JSON validation OK")
          PY

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/health.json data/snapshot.json data/history-2h.json data/xaut.json data/liquidations.json data/derived.json data/multi-tf.json data/radar-core.json data/market-state-history.json data/uniswap-lp.json
          if [ -f data/liquidations-last-good.json ]; then
            git add data/liquidations-last-good.json
          fi
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "data: refresh public crypto snapshots"
            git pull --rebase origin main
            git push
          fi
