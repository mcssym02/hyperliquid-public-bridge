name: Refresh Hyperliquid public data

on:
  workflow_dispatch:
  push:
    paths:
      - "app.py"
      - "collect_static.py"
      - "requirements.txt"
      - ".github/workflows/refresh-data.yml"
  schedule:
    - cron: "45,55 * * * *"

permissions:
  contents: write

concurrency:
  group: hyperliquid-data-refresh
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect official Hyperliquid data and public liquidation feed
        run: python collect_static.py

      - name: Validate generated JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          required = [
              "health.json",
              "snapshot.json",
              "history-2h.json",
              "xaut.json",
              "liquidations.json",
              "derived.json",
              "radar-core.json",
              "market-state-history.json",
          ]
          loaded = {}
          for name in required:
              p = Path("data") / name
              assert p.exists(), f"missing {p}"
              data = json.loads(p.read_text())
              assert data.get("timestamp_utc"), f"missing timestamp in {name}"
              loaded[name] = data

          xaut = loaded["xaut.json"]
          assert xaut.get("instrument") == "XAUT0/USDC", "XAUT identity mismatch"
          assert xaut.get("type") == "spot", "XAUT must be spot"
          if xaut.get("status") in ("OK", "PARTIAL"):
              assert str(xaut.get("api_coin", "")).startswith("@"), "XAUT @index missing"
              assert xaut.get("base", {}).get("name") == "XAUT0", "wrong XAUT base token"
              assert xaut.get("quote", {}).get("name") == "USDC", "wrong XAUT quote token"

          snapshot = loaded["snapshot.json"]
          snap_xaut = next((a for a in snapshot.get("assets", []) if a.get("asset") == "XAUT0"), None)
          assert snap_xaut is not None, "XAUT missing from snapshot"
          assert snap_xaut.get("instrument") == "XAUT0/USDC", "snapshot XAUT identity mismatch"
          assert snap_xaut.get("type") == "spot", "snapshot XAUT must be spot"

          derived = loaded["derived.json"]
          assets = {a.get("asset"): a for a in derived.get("assets", []) if isinstance(a, dict)}
          for asset in ("BTC", "ETH", "SOL", "HYPE", "XAUT0"):
              assert asset in assets, f"{asset} missing from derived.json"
          assert assets["XAUT0"].get("delta_oi_h1_abs") == "NOT_APPLICABLE", "XAUT OI must be N/A"
          assert assets["XAUT0"].get("funding") == "NOT_APPLICABLE", "XAUT funding must be N/A"

          liq = loaded["liquidations.json"]
          assert liq.get("window_minutes") == 60, "liquidation window must be 60m"
          liq_assets = {a.get("asset"): a for a in liq.get("assets", []) if isinstance(a, dict)}
          for asset in ("BTC", "ETH", "SOL", "HYPE"):
              assert asset in liq_assets, f"{asset} missing from liquidations.json"
              row = liq_assets[asset]
              assert "global_coverage_status" in row, f"{asset} global liquidation coverage missing"
              assert "global_h1" in row, f"{asset} global liquidation aggregate missing"
              assert "hyperliquid_coverage_status" in row, f"{asset} HL liquidation coverage missing"
              assert "hyperliquid_observed_h1" in row, f"{asset} HL liquidation aggregate missing"
              if row.get("global_coverage_status") == "FULL_60M_ARCHIVE":
                  gh = row.get("global_h1", {})
                  assert gh.get("status") == "OK", f"{asset} global H-1 marked full but aggregate not OK"
                  assert gh.get("total_usd") is not None, f"{asset} global H-1 total missing"
                  assert gh.get("long_usd") is not None, f"{asset} global long liquidation total missing"
                  assert gh.get("short_usd") is not None, f"{asset} global short liquidation total missing"

          state = loaded["market-state-history.json"]
          assert isinstance(state.get("records"), list), "state records missing"
          assert state.get("record_count") == len(state.get("records", [])), "state record_count mismatch"
          print("JSON validation OK")
          PY

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/health.json data/snapshot.json data/history-2h.json data/xaut.json data/liquidations.json data/derived.json data/radar-core.json data/market-state-history.json
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "data: refresh Hyperliquid snapshot"
            git push
          fi
